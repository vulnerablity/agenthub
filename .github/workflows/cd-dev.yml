# =========================================
# AgentHub CD - dev：dev 分支合并后自动部署开发环境
#   1. 构建 backend / frontend 镜像并推送 GHCR（ghcr.io/vulnerablity/agenthub/...）
#   2. 若已配置服务器 Secrets，则 SSH 到服务器拉取镜像并重启
#
# 服务器就绪前：deploy job 自动跳过（ENABLE_DEV_DEPLOY 变量未设）
# 服务器就绪后：在 GitHub 仓库 Settings -> Secrets and variables -> Actions 配置：
#   Variables 页签：ENABLE_DEV_DEPLOY = true  （开关）
#   Secrets 页签：
#     SERVER_HOST    服务器 IP 或域名
#     SERVER_USERNAME SSH 用户名（如 root）
#     SERVER_SSH_KEY SSH 私钥（先在服务器添加对应公钥）
#     SERVER_PORT    SSH 端口（默认 22，可不配）
#   服务器上需准备 /opt/agenthub/：docker-compose.prod.yml + .env
# =========================================

name: CD - dev

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:dev
            ghcr.io/${{ github.repository }}/backend:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:dev
            ghcr.io/${{ github.repository }}/frontend:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy-dev
    needs: build-and-push
    runs-on: ubuntu-latest
    # 仅当仓库变量 ENABLE_DEV_DEPLOY=true 时才部署；
    # 服务器就绪前不设此变量，整个 deploy job 自动跳过
    # （if 表达式不能引用 secrets，只能用 vars）
    if: ${{ vars.ENABLE_DEV_DEPLOY == 'true' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /opt/agenthub
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
