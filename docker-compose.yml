# =========================================
# AgentHub 本地开发编排（docker compose up -d）
# 首次使用：复制 .env.example 为 .env，修改数据库/Redis/JWT 密码
#   copy .env.example .env
# =========================================

services:
  mysql:
    image: mysql:8.4
    container_name: agenthub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agenthub}
      MYSQL_USER: ${MYSQL_USER:-agenthub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      # 若本机 3306 已被本地 MySQL 占用，删除此行或改宿主机端口（如 "13306:3306"）
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.16.1
    container_name: agenthub-qdrant
    ports:
      # 向量库 REST 端口；知识库模块使用（knowledge.md 2）
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: agenthub-backend
    environment:
      APP_ENV: production
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      # 生产/部署请务必在 .env 中设置强随机密钥（至少 32 字节）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agenthub}
      MYSQL_USER: ${MYSQL_USER:-agenthub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-agenthub}:${MYSQL_PASSWORD:-change-me}@mysql:3306/${MYSQL_DATABASE:-agenthub}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # LLM 网关（OpenAI 兼容协议，chat 模块）；在 .env 中配置实际地址与密钥
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      # 向量库与 Embedding（知识库模块）；qdrant 服务名即同文件 qdrant 容器
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/storage/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DOCUMENT_PROCESSING_TIMEOUT: ${DOCUMENT_PROCESSING_TIMEOUT:-300}
    ports:
      - "8000:8000"
    # 上传文档持久化：宿主机 backend/storage 映射容器 /app/storage（容器重建不丢文件）
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: agenthub-frontend
    ports:
      # 前端入口：浏览器访问 http://localhost
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  qdrant_data:
